[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jasp-nexus"
version = "0.1.0"
description = "Local control plane for modular coding agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nexus = "jasp_nexus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
